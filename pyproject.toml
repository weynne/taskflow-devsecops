[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes, B: bugbear, S: flake8-bandit (regras de seguranca)
select = ["E", "W", "F", "B", "S"]

[tool.ruff.lint.per-file-ignores]
# assert e o padrao do pytest
"tests/*" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
