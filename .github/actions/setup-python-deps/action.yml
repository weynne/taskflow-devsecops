name: Setup Python e dependencias
description: >
  Configura o Python na versao definida em .python-version (fonte unica da
  verdade) e instala as dependencias do projeto. Reutilizado por todos os
  workflows para evitar repetir os mesmos steps (DRY).

inputs:
  requirements:
    description: Arquivos de requirements a instalar, separados por espaco
    required: false
    default: requirements.txt requirements-dev.txt

runs:
  using: composite
  steps:
    - name: Configurar Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version-file: .python-version
        cache: pip

    - name: Instalar dependencias
      shell: bash
      env:
        REQUIREMENTS: ${{ inputs.requirements }}
      run: |
        python -m pip install --upgrade pip
        for req in $REQUIREMENTS; do
          pip install -r "$req"
        done
