# CI - build e lint da TaskFlow.
# Roda em todo PR para a main (portao antes do merge), em push na main
# e sob demanda pela aba Actions.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Build e lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do codigo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python e dependencias
        uses: ./.github/actions/setup-python-deps

      - name: Verificar sintaxe
        run: python -m compileall -q .

      - name: Lint com ruff
        run: ruff check --output-format=github .
